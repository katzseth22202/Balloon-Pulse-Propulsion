<?xml version="1.0" encoding="UTF-8"?>
<!-- The pass-through X-ray pusher for a 4 solar radii dive, schematic side view.
     (a) Before the pulse: the projectile arrives from ahead, threads the ring ship's bore,
         and enters the pulse unit set 5 to 10 m astern on its line.
     (b) The pulse: the projectile strikes the carbon-foam target, the radiation case holds
         the X-rays, the filler blows off astern, and the propellant plate is driven forward
         onto the pusher plate as a jet.
     Not to scale. Generated by todos/make_pass_through_svg.py (gitignored scratch in the paper repo).
     If that script exists, edit it and rerun it. If not, edit this file by hand.
     Export for the paper with:
       inkscape images/pass_through_pusher.svg -o images/pass_through_pusher.pdf -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940">
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; fill: #222; }
      .title { font-size: 19px; font-weight: bold; }
      .small { font-size: 15px; }
      .leader { stroke: #888; stroke-width: 1.2; fill: none; }
      .axis { stroke: #999; stroke-width: 1.2; stroke-dasharray: 10 4 2 4; fill: none; }
    </style>
    <pattern id="foam" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#6E6E6E"/>
      <circle cx="3" cy="3" r="1.6" fill="#5A5A5A"/><circle cx="8" cy="7" r="1.3" fill="#5A5A5A"/></pattern>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#FFF176"/>
      <stop offset="1" stop-color="#FF8F00" stop-opacity="0.2"/></radialGradient>
    <linearGradient id="jet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37474F" stop-opacity="0.95"/><stop offset="1" stop-color="#FF7043" stop-opacity="0.55"/></linearGradient>
    <marker id="arrowDark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0,1 L 12,6 L 0,11 Z" fill="#333"/></marker>
    <marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0,1 L 12,6 L 0,11 Z" fill="#C62828"/></marker>
    <marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0,1 L 10,5 L 0,9 Z" fill="#7E57C2"/></marker>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0,1 L 12,6 L 0,11 Z" fill="#0288D1"/></marker>
  </defs>
  <rect width="1000" height="940" fill="#ffffff"/>

