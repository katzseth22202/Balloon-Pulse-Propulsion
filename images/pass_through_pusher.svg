<?xml version="1.0" encoding="UTF-8"?>
<!-- The pass-through X-ray pusher for a 4 solar radii dive, schematic side view.
     (a) Before the pulse: the projectile arrives from ahead, threads the ring ship's bore,
         and enters the pulse unit set 5 to 10 m astern on its line.
     (b) The pulse: the projectile sweeps the carbon lattice target, the radiation case holds
         the X-rays, the filler blows off astern, and the propellant plate is driven forward
         onto the pusher plate as a jet.
     (c) The projectile at periapsis with the Sun overhead, drawn to scale at 6 px/cm: the graphite
         disk flies face-first and edge-on to the Sun, and a carbon-foam brow with a sacrificial
         graphite face shades the guidance pod from the whole 29 degree solar disk.
     Panels (a) and (b) are not to scale. Panel (c) was added by hand on 2026-10-08. Generated by todos/make_pass_through_svg.py (gitignored scratch in the paper repo).
     If that script exists, edit it and rerun it. If not, edit this file by hand.
     Export for the paper with:
       inkscape images/pass_through_pusher.svg -o images/pass_through_pusher.pdf -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330">
  <defs>
    <style>
