<?xml version="1.0" encoding="UTF-8"?>
<!-- Wall detail of the near-term walled chamber: methane at 7000 K on a steel shell lined
     with sprayed pitch, for the 2.5 kg rod in its 20 m^3 chamber.
     (a) During the pulse: flux on the wall, the pitch charring and ablating, steel behind it.
     (b) Between pulses: liquid methane quench spray, then a ~0.1 mm pitch recoat; backup
         coolant channels in the steel are drawn dashed.
     (c) One 250 ms cycle at 4 Hz.
     (d) Mass carried per pulse.
     Layer thicknesses are not to scale.
     Each element sits in a named Inkscape layer.
     Export for the paper with:
       inkscape images/methane_wall_detail.svg -o images/methane_wall_detail.pdf -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="1000" height="1060" viewBox="0 0 1000 1060">
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" inkscape:document-units="px"/>
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; fill: #222; }
      .small { font-size: 15px; }
      .tiny { font-size: 13.5px; }
      .title { font-size: 19px; font-weight: bold; }
      .leader { stroke: #888; stroke-width: 1.2; fill: none; }
      .rad { stroke: #D9822B; stroke-width: 2.4; fill: none; }
      .conv { stroke: #B03A2E; stroke-width: 2.4; fill: none; }
      .gasout { stroke: #6B4E2E; stroke-width: 1.8; fill: none; }
      .spray { stroke: #1F5F8B; stroke-width: 1.4; fill: none; }
    </style>
    <linearGradient id="plasma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F29E4C"/>
    </linearGradient>
    <linearGradient id="coldgas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEF4F8"/>
      <stop offset="1" stop-color="#D6E6F1"/>
    </linearGradient>
    <pattern id="steel" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#AEB8BF"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#98A3AB" stroke-width="2"/>
    </pattern>
    <pattern id="pitch" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#5A4632"/>
      <circle cx="2" cy="2" r="0.8" fill="#6E5840"/>
    </pattern>
    <pattern id="char" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#2B2B2B"/>
      <circle cx="1.5" cy="1.5" r="0.9" fill="#4A4A4A"/>
      <circle cx="3.8" cy="3.6" r="0.7" fill="#4A4A4A"/>
    </pattern>
    <marker id="arrowRad" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0,1 L 12,6 L 0,11 Z" fill="#D9822B"/>
    </marker>
    <marker id="arrowConv" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0,1 L 12,6 L 0,11 Z" fill="#B03A2E"/>
    </marker>
    <marker id="arrowGas" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0,1 L 10,5 L 0,9 Z" fill="#6B4E2E"/>
    </marker>
    <marker id="arrowDark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0,1 L 12,6 L 0,11 Z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1000" height="1060" fill="#ffffff"/>

  <!-- ===================== (a) During the pulse ===================== -->
  <g inkscape:groupmode="layer" id="panel_a" inkscape:label="(a) during the pulse">
    <text x="30" y="36" class="title">(a) During the pulse, 25 to 53 ms</text>
    <!-- gas -->
    <rect x="40" y="60" width="430" height="250" fill="url(#plasma)"/>
    <text x="60" y="92">Methane plasma, 7000 K, 493 bar peak</text>
    <text x="60" y="116" class="small">62 kg charge + 4.4 kg plug + rod</text>
    <!-- layers -->
    <rect x="470" y="60" width="18" height="250" fill="url(#char)"/>
    <rect x="488" y="60" width="32" height="250" fill="url(#pitch)"/>
    <rect x="520" y="60" width="260" height="250" fill="url(#steel)"/>
    <line x1="470" y1="60" x2="470" y2="310" stroke="#111" stroke-width="1.5"/>
    <line x1="520" y1="60" x2="520" y2="310" stroke="#333" stroke-width="1.2"/>
    <!-- radiation: wavy arrows -->
    <path class="rad" marker-end="url(#arrowRad)" d="M 110,160 q 12,-10 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 20,0"/>
    <path class="rad" marker-end="url(#arrowRad)" d="M 110,200 q 12,-10 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 24,0 t 20,0"/>
    <text x="110" y="146" class="small">radiation, 136 MW/m²</text>
    <!-- convection: straight arrows -->
    <line class="conv" marker-end="url(#arrowConv)" x1="110" y1="248" x2="462" y2="248"/>
    <line class="conv" marker-end="url(#arrowConv)" x1="110" y1="276" x2="462" y2="276"/>
    <text x="110" y="238" class="small">convection, 39 to 74 MW/m²</text>
    <text x="110" y="300" class="small">4.4 to 11.1 MJ/m² per pulse</text>
    <!-- pyrolysis gas blowing out -->
    <line class="gasout" marker-end="url(#arrowGas)" x1="468" y1="96" x2="420" y2="96"/>
    <line class="gasout" marker-end="url(#arrowGas)" x1="468" y1="120" x2="420" y2="120"/>
    <line class="gasout" marker-end="url(#arrowGas)" x1="468" y1="108" x2="420" y2="108"/>
    <!-- labels -->
    <path class="leader" d="M 479,64 L 479,40 L 600,40"/>
    <text x="606" y="45" class="small">charred surface, ~3900 K, ablating</text>
    <path class="leader" d="M 504,316 L 504,340 L 560,340"/>
    <text x="566" y="345" class="small">pitch, 0.2 mm standing layer</text>
    <text x="790" y="96" class="small">Cr–Mo steel shell</text>
    <text x="790" y="120" class="small">peaks at 450–490 K</text>
    <text x="790" y="170" class="small">pitch lost per pulse:</text>
    <text x="790" y="192" class="small">43 to 117 µm</text>
    <text x="790" y="214" class="small">2.0 to 5.4 kg</text>
    <text x="790" y="264" class="small">left in the wall:</text>
    <text x="790" y="286" class="small">1.0 to 2.2 MJ/m²</text>
    <text x="318" y="146" class="tiny" fill="#6B4E2E">pyrolysis gas</text>
  </g>

  <!-- ===================== (b) Between pulses ===================== -->
  <g inkscape:groupmode="layer" id="panel_b" inkscape:label="(b) between pulses">
    <text x="30" y="396" class="title">(b) Between pulses: quench, then recoat</text>
    <rect x="40" y="420" width="430" height="250" fill="url(#coldgas)"/>
    <rect x="470" y="420" width="10" height="250" fill="url(#char)"/>
    <rect x="480" y="420" width="40" height="250" fill="url(#pitch)"/>
    <rect x="520" y="420" width="260" height="250" fill="url(#steel)"/>
    <line x1="470" y1="420" x2="470" y2="670" stroke="#111" stroke-width="1.5"/>
    <line x1="520" y1="420" x2="520" y2="670" stroke="#333" stroke-width="1.2"/>
    <!-- fresh pitch band being laid down -->
    <rect x="460" y="555" width="10" height="115" fill="#8A6A48" stroke="#5A4632" stroke-width="1"/>
    <!-- backup channels, dashed -->
    <circle cx="700" cy="475" r="13" fill="#ffffff" stroke="#1F5F8B" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="700" cy="545" r="13" fill="#ffffff" stroke="#1F5F8B" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="700" cy="615" r="13" fill="#ffffff" stroke="#1F5F8B" stroke-width="1.6" stroke-dasharray="4 3"/>
    <!-- methane quench spray head -->
    <rect x="70" y="440" width="46" height="36" rx="5" fill="#1F5F8B"/>
    <text x="64" y="500" class="tiny">LCH₄</text>
    <path class="spray" d="M 116,452 L 462,430 M 116,458 L 462,462 M 116,464 L 462,494 M 116,470 L 462,526"/>
    <g fill="#1F5F8B">
      <circle cx="200" cy="448" r="2.2"/><circle cx="260" cy="459" r="2.2"/><circle cx="320" cy="472" r="2.2"/>
      <circle cx="380" cy="440" r="2.2"/><circle cx="430" cy="500" r="2.2"/><circle cx="350" cy="495" r="2.2"/>
      <circle cx="240" cy="480" r="2.2"/><circle cx="410" cy="462" r="2.2"/>
    </g>
    <text x="150" y="518" class="small">1. liquid methane quench spray</text>
    <text x="150" y="538" class="tiny">takes back the 1.0–2.2 MJ/m² left in the wall;</text>
    <text x="150" y="555" class="tiny">the warmed methane joins the next charge</text>
    <!-- pitch recoat spray head -->
    <rect x="70" y="590" width="46" height="36" rx="5" fill="#5A4632"/>
    <text x="64" y="650" class="tiny">pitch</text>
    <path class="gasout" d="M 116,602 L 456,560 M 116,608 L 456,600 M 116,614 L 456,640 M 116,620 L 456,668" stroke-width="1.4"/>
    <text x="150" y="586" class="small">2. pitch recoat, about 0.1 mm</text>
    <text x="150" y="662" class="tiny">sets as a cold layer on the chilled wall</text>
    <!-- labels right -->
    <text x="790" y="462" class="small">backup coolant</text>
    <text x="790" y="484" class="small">channels, used only</text>
    <text x="790" y="506" class="small">if spray cooling</text>
    <text x="790" y="528" class="small">falls short</text>
    <text x="790" y="590" class="small">no regenerative</text>
    <text x="790" y="612" class="small">liner in the</text>
    <text x="790" y="634" class="small">baseline</text>
    <text x="40" y="694" class="tiny">Layer thicknesses are not to scale. Pitch is exaggerated about 100 times against the steel.</text>
  </g>

  <!-- ===================== (c) One cycle ===================== -->
  <g inkscape:groupmode="layer" id="panel_c" inkscape:label="(c) one 250 ms cycle">
    <text x="30" y="742" class="title">(c) One 250 ms cycle at 4 Hz</text>
    <!-- 250 ms spans x 60..940 : 3.52 px per ms -->
    <rect x="60" y="760" width="186" height="40" fill="#F29E4C"/>
    <rect x="246" y="760" width="176" height="40" fill="#1F5F8B"/>
    <rect x="422" y="760" width="176" height="40" fill="#8A6A48"/>
    <rect x="598" y="760" width="272" height="40" fill="#9CC3DE"/>
    <rect x="870" y="760" width="70" height="40" fill="#5E6A73"/>
    <rect x="60" y="760" width="880" height="40" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="72" y="786" class="small" fill="#222">pulse, blowdown</text>
    <text x="262" y="786" class="small" fill="#ffffff">methane quench</text>
    <text x="440" y="786" class="small" fill="#ffffff">pitch recoat</text>
    <text x="620" y="786" class="small">charge fill</text>
    <text x="876" y="786" class="tiny" fill="#ffffff">lock</text>
    <line x1="60" y1="808" x2="60" y2="818" stroke="#333"/>
    <line x1="246" y1="808" x2="246" y2="818" stroke="#333"/>
    <line x1="870" y1="808" x2="870" y2="818" stroke="#333"/>
    <line x1="940" y1="808" x2="940" y2="818" stroke="#333"/>
    <text x="52" y="836" class="tiny">0</text>
    <text x="226" y="836" class="tiny">~53 ms</text>
    <text x="840" y="836" class="tiny">230 ms</text>
    <text x="920" y="836" class="tiny">250 ms</text>
    <text x="330" y="858" class="tiny">phase lengths after the pulse are illustrative, not timed</text>
  </g>

  <!-- ===================== (d) Mass per pulse ===================== -->
  <g inkscape:groupmode="layer" id="panel_d" inkscape:label="(d) mass per pulse">
    <text x="30" y="906" class="title">(d) Mass per pulse, 2.5 kg rod</text>
    <!-- scale: 10 px per kg, total ~74.5 kg -->
    <rect x="60" y="924" width="620" height="40" fill="#9CC3DE"/>
    <rect x="680" y="924" width="44" height="40" fill="#C9D3DA"/>
    <rect x="724" y="924" width="46" height="40" fill="#8A6A48"/>
    <rect x="770" y="924" width="25" height="40" fill="#5E6A73"/>
    <rect x="60" y="924" width="735" height="40" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="72" y="950">methane charge, 62 kg</text>
    <path class="leader" d="M 702,968 L 702,990"/>
    <text x="600" y="1006" class="small">plug 4.4 kg</text>
    <path class="leader" d="M 747,968 L 747,1026"/>
    <text x="700" y="1044" class="small">pitch 2.0–5.4 kg</text>
    <path class="leader" d="M 782,920 L 782,904 L 810,904"/>
    <text x="814" y="909" class="small">rod 2.5 kg</text>
    <text x="814" y="931" class="tiny">(arrives, not carried)</text>
    <text x="60" y="1006" class="small">pitch is 3 to 8% of the carried 68 to 72 kg</text>
  </g>
</svg>
