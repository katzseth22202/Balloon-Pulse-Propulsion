    <text x="581.8" y="172.7" text-anchor="start" class="small"><tspan x="581.8" dy="0em">Outbound: prograde,</tspan><tspan x="581.8" dy="1.2em">with the planets</tspan></text>
    <path d="M 579.8,190.7 L 545.8,284.7" class="leader"/>
    <text x="171.4" y="299.9" text-anchor="end" class="small"><tspan x="171.4" dy="0em">Return: retrograde,</tspan><tspan x="171.4" dy="1.2em">against the planets</tspan></text>
    <path d="M 169.4,285.9 L 187.4,243.9" class="leader"/>
    <text x="492.7" y="257.2" text-anchor="start" class="small" font-weight="bold">Meets Earth head-on</text>
    <path d="M 490.7,261.2 L 458.7,309.2" class="leader"/>
  </g>

  <g inkscape:groupmode="layer" id="layer-legend" inkscape:label="Legend">
    <line x1="40" y1="700" x2="90" y2="700" stroke="#1F5F8B" stroke-width="3"/>
    <text x="104.0" y="706.0" text-anchor="start">Three synodic periods, 3.28 yr. Returns at 56.5 to 57.4 km/s.</text>
    <line x1="40" y1="736" x2="90" y2="736" stroke="#D55E00" stroke-width="3"/>
    <text x="104.0" y="742.0" text-anchor="start"><tspan x="104.0" dy="0em">Two synodic periods, 2.18 yr. Returns at 61.8 to 65.1 km/s.</tspan><tspan x="104.0" dy="1.2em">Closer flyby, down to 4000 km altitude (1.056 Jupiter radii).</tspan></text>
    <line x1="780" y1="700" x2="830" y2="700" stroke="#555" stroke-width="3"/>
    <text x="840.0" y="706.0" text-anchor="start" class="small">outbound</text>
    <line x1="780" y1="736" x2="830" y2="736" stroke="#555" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="840.0" y="742.0" text-anchor="start" class="small">return</text>
  </g>
</svg>
