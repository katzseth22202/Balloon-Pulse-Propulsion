<!-- Sun-pointing cone shield for a 4 solar radii periapsis, schematic.
     (a) The 15 degree cone: flank loading, interior stack, and the umbra behind the base
         that hosts the terminal-guidance camera and pulsed beacon.
     (b) Apex close-up: tungsten insert seated in fine-grained graphite, the conduction clamp,
         and the dust strike that could blunt it.
     Angles are true; sizes are not to scale.
     Generated by todos/make_sun_cone_svg.py (gitignored scratch in the paper repo).
     If that script exists, edit it and rerun it. If not, edit this file by hand.
     Export for the paper with:
       inkscape images/sun_cone.svg -o images/sun_cone.pdf -->
