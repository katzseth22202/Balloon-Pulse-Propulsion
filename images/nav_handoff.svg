<?xml version="1.0" encoding="UTF-8"?>
<!-- Approach ladder for a Jupiter-return stream: which reference and which actuator hold each
     phase, on a logarithmic distance axis from release (about 0.53 AU, 16 days) to arrival.
     Generated by todos/make_nav_handoff_svg.py (gitignored scratch in the paper repo).
     If that script exists, edit it and rerun it. If not, edit this file by hand. Not to scale in the inset.
     Export for the paper with:
       inkscape images/nav_handoff.svg -o images/nav_handoff.pdf -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; fill: #222; }
      .small { font-size: 15px; } .tiny { font-size: 13px; }
      .title { font-size: 19px; font-weight: bold; }
      .tick { stroke: #333; stroke-width: 1.2; }
      .guide { stroke: #999; stroke-width: 1; stroke-dasharray: 3 4; }
    </style>
    <marker id="arrowDark" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0,2 L 14,7 L 0,12 Z" fill="#333"/></marker>
    <marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0,2 L 14,7 L 0,12 Z" fill="#C62828"/></marker>
  </defs>
  <text x="20" y="30" class="title">Approach ladder, release to arrival</text>
<line x1="190" y1="80" x2="979" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>
<text x="190" y="52" class="tiny" style="fill:#555">distance to Earth (log scale) and time to arrival</text>
<line x1="199.6" y1="74" x2="199.6" y2="86" class="tick"/>
<text x="199.6" y="70" class="tiny" text-anchor="middle">0.53 AU</text>
<text x="199.6" y="102" class="tiny" text-anchor="middle" style="fill:#555">16 d</text>
<line x1="199.6" y1="108" x2="199.6" y2="400" class="guide"/>
<line x1="257.5" y1="74" x2="257.5" y2="86" class="tick"/>
<text x="257.5" y="70" class="tiny" text-anchor="middle">2e7</text>
<text x="257.5" y="102" class="tiny" text-anchor="middle" style="fill:#555">4 d</text>
<line x1="257.5" y1="108" x2="257.5" y2="400" class="guide"/>
<line x1="314.7" y1="74" x2="314.7" y2="86" class="tick"/>
<text x="314.7" y="70" class="tiny" text-anchor="middle">5e6 km</text>
<text x="314.7" y="102" class="tiny" text-anchor="middle" style="fill:#555">1 d</text>
<line x1="314.7" y1="108" x2="314.7" y2="400" class="guide"/>
<line x1="419.4" y1="74" x2="419.4" y2="86" class="tick"/>
<text x="419.4" y="70" class="tiny" text-anchor="middle">Moon's distance</text>
<text x="419.4" y="102" class="tiny" text-anchor="middle" style="fill:#555">2 h</text>
<line x1="419.4" y1="108" x2="419.4" y2="400" class="guide"/>
<line x1="512.8" y1="74" x2="512.8" y2="86" class="tick"/>
<text x="512.8" y="70" class="tiny" text-anchor="middle">40,000 km</text>
<text x="512.8" y="102" class="tiny" text-anchor="middle" style="fill:#555">11 min</text>
<line x1="512.8" y1="108" x2="512.8" y2="400" class="guide"/>
<line x1="869.7" y1="74" x2="869.7" y2="86" class="tick"/>
<text x="869.7" y="70" class="tiny" text-anchor="middle">7 km</text>
<text x="869.7" y="102" class="tiny" text-anchor="middle" style="fill:#555">0.1 s</text>
<line x1="869.7" y1="108" x2="869.7" y2="400" class="guide"/>
<text x="971" y="102" class="tiny" text-anchor="end" style="font-weight:bold">arrival</text>
<text x="20" y="167" class="small" style="font-weight:bold">Absolute</text>
<text x="20" y="227" class="small" style="font-weight:bold">Relative</text>
<text x="20" y="287" class="small" style="font-weight:bold">Actuator</text>
<rect x="200.6" y="140" width="311.2" height="44" rx="4" fill="#D6E6F2" stroke="#6B7780" stroke-width="1"/>
<text x="356.2" y="167" class="small" text-anchor="middle">delta-DOR on the co-flyers</text>
<rect x="513.8" y="140" width="354.9" height="44" rx="4" fill="#D8EDD5" stroke="#6B7780" stroke-width="1"/>
<text x="691.3" y="167" class="small" text-anchor="middle">GNSS</text>
<rect x="870.7" y="140" width="106.9" height="44" rx="4" fill="#FBE3C8" stroke="#6B7780" stroke-width="1"/>
<text x="924.2" y="159" class="tiny" text-anchor="middle">ship</text>
<text x="924.2" y="175" class="tiny" text-anchor="middle">trackers</text>
<rect x="200.6" y="200" width="311.2" height="44" rx="4" fill="#D6E6F2" stroke="#6B7780" stroke-width="1"/>
<text x="356.2" y="227" class="small" text-anchor="middle">co-flyer ranging broadcast</text>
<rect x="513.8" y="200" width="354.9" height="44" rx="4" fill="#D8EDD5" stroke="#6B7780" stroke-width="1"/>
<text x="691.3" y="227" class="small" text-anchor="middle">differential GNSS against co-flyers</text>
<rect x="870.7" y="200" width="106.9" height="44" rx="4" fill="#FBE3C8" stroke="#6B7780" stroke-width="1"/>
<text x="924.2" y="219" class="tiny" text-anchor="middle">ship</text>
<text x="924.2" y="235" class="tiny" text-anchor="middle">trackers</text>
<rect x="200.6" y="260" width="311.2" height="44" rx="4" fill="#D6E6F2" stroke="#6B7780" stroke-width="1"/>
<text x="356.2" y="287" class="small" text-anchor="middle">PuffSat thrusters: coast trims</text>
<rect x="513.8" y="260" width="354.9" height="44" rx="4" fill="#D8EDD5" stroke="#6B7780" stroke-width="1"/>
<text x="691.3" y="279" class="small" text-anchor="middle">PuffSat thrusters</text>
<text x="691.3" y="295" class="small" text-anchor="middle">+ target shifts up to 300 m</text>
<rect x="870.7" y="260" width="106.9" height="44" rx="4" fill="#FBE3C8" stroke="#6B7780" stroke-width="1"/>
<text x="924.2" y="279" class="tiny" text-anchor="middle">door (rod)</text>
<text x="924.2" y="295" class="tiny" text-anchor="middle">plate (ring)</text>
<line x1="869.7" y1="318" x2="978.6" y2="318" stroke="#2E7D32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="978.6" y="336" class="tiny" text-anchor="end" style="fill:#2E7D32">rod thrusters fire to arrival</text>
<text x="20" y="378" class="small" style="font-weight:bold">delta-DOR</text>
<text x="20" y="396" class="tiny">single fix</text>
<circle cx="199.6" cy="372" r="4" fill="#1F5F8B"/>
<text x="199.6" y="394" class="small" text-anchor="middle">151 m</text>
<circle cx="257.5" cy="372" r="4" fill="#1F5F8B"/>
<text x="257.5" y="394" class="small" text-anchor="middle">37 m</text>
<circle cx="314.7" cy="372" r="4" fill="#1F5F8B"/>
<text x="314.7" y="394" class="small" text-anchor="middle">9 m</text>
<text x="399.4" y="378" class="tiny" style="fill:#555">1.9 nrad per fix; Doppler over weeks does better</text>
<text x="20" y="440" class="small" style="font-weight:bold">Inset: the last 40,000 km (not to scale)</text>
<circle cx="200" cy="560" r="116" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="200" cy="560" r="66" fill="none" stroke="#6B7780" stroke-width="1.5"/>
<circle cx="200" cy="560" r="16" fill="#4A90B8"/>
<text x="320" y="468" class="tiny" style="fill:#2E7D32">GNSS starts: twice the GNSS orbit, ~11 min out</text>
<text x="274" y="516" class="tiny">GNSS satellites, 20,200 km altitude</text>
<line x1="900" y1="500" x2="222" y2="538" stroke="#F4A259" stroke-width="4" marker-end="url(#arrowDark)"/>
<text x="640" y="488" class="small">stream, nearly head-on</text>
<text x="480" y="600" class="tiny">Below twice-MEO the target learns the formation's true</text>
<text x="480" y="618" class="tiny">position and shifts up to 300 m (about 2 m/s over 11 min).</text>
<text x="480" y="646" class="tiny">Ship trackers: 1 cm at 7 km, 0.1 s out. The door then</text>
<text x="480" y="664" class="tiny">trims the last error and locks 20 ms before arrival.</text>
</svg>