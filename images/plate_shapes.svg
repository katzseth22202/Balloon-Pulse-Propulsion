<?xml version="1.0" encoding="UTF-8"?>
<!-- Plate shapes: the impact simulation's six 150 t plate shapes for the Jupiter growth push,
     drawn in section to one scale (20 m across). Gas arrives from the left; the vehicle is off
     to the right. eta_jet is argon at k = 8.52, unmixed to premixed, from
     puffsat_impact_simulation's plate_shape sizing (make water-plate-argon-2d-shape), except
     the open flat plate, which is the 2-D cup study's ~0.33-0.40. Hoop-wrap thickness is drawn
     to show where it sits, not to scale. Generated by a script; each panel is a named layer.
     Export with: inkscape images/plate_shapes.svg -o images/plate_shapes.pdf -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1030" height="800"
     viewBox="0 0 1030 800">
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 16px; fill: #222; }
      .small { font-size: 13.5px; }
      .title { font-size: 15.5px; font-weight: bold; }
      .eta { font-size: 18px; }
      .sub { font-size: 12px; }
      .chosen { fill: #1F5F8B; font-weight: bold; }
      .panel { fill: #FAFAFA; stroke: #BBB; stroke-width: 1.2; }
      .panelChosen { fill: #F1F6FA; stroke: #1F5F8B; stroke-width: 2.4; }
      .steel { stroke: #4A5560; stroke-width: 4; fill: none; stroke-linejoin: round; }
      .skirt { stroke: #4A5560; stroke-width: 4; fill: none; }
      .wrap { fill: #2B2B2B; fill-opacity: 0.55; stroke: none; }
      .gas { stroke: #C77D1A; stroke-width: 3; fill: none; }
      .flow { stroke: #1F5F8B; stroke-width: 2.2; fill: none; }
      .spill { stroke: #C62828; stroke-width: 2.2; stroke-dasharray: 6 4; fill: none; }
    </style>
    <marker id="arrowGas" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M 0,2 L 16,8 L 0,14 Z" fill="#C77D1A"/>
    </marker>
    <marker id="arrowFlow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M 0,2 L 13,6.5 L 0,11 Z" fill="#1F5F8B"/>
    </marker>
    <marker id="arrowSpill" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M 0,2 L 13,6.5 L 0,11 Z" fill="#C62828"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g inkscape:groupmode="layer" inkscape:label="Legend" id="legend">
    <path class="gas" d="M 24,30 L 64,30" marker-end="url(#arrowGas)"/>
    <text x="72" y="35" class="small">PuffSat gas</text>
    <path class="flow" d="M 190,30 L 230,30" marker-end="url(#arrowFlow)"/>
    <text x="238" y="35" class="small">rebound</text>
    <path class="spill" d="M 330,30 L 370,30" marker-end="url(#arrowSpill)"/>
    <text x="378" y="35" class="small">spill past the rim</text>
    <rect x="530" y="22" width="30" height="14" class="wrap"/>
    <text x="568" y="35" class="small">carbon hoop wrap (thickness not to scale)</text>
    <path class="steel" d="M 900,30 L 945,30" style="stroke-width:2"/>
    <path class="steel" d="M 900,24 L 900,36 M 945,24 L 945,36" style="stroke-width:2"/>
    <text x="953" y="35" class="small">5 m</text>
  </g>
