<?xml version="1.0" encoding="UTF-8"?>
<!-- Mirrored light cavity: a payload at Jupiter warmed by concentrating mirrors, with PV cells
     reached only through a two-bend mirrored cavity. Each element sits in a named Inkscape layer.
     Export for the paper with:
       inkscape images/mirrored_light_cavity.svg -o images/mirrored_light_cavity.pdf -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="1000" height="780" viewBox="0 0 1000 780">
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" inkscape:document-units="px"/>
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; fill: #222; }
      .small { font-size: 15px; }
      .ray { stroke: #D9A400; stroke-width: 2.5; fill: none; }
      .beam { stroke: #F2B400; stroke-width: 9; fill: none; stroke-linejoin: round; opacity: 0.9; }
      .mirror { stroke: #7F8C96; stroke-width: 6; fill: none; stroke-linecap: round; }
      .fold { stroke: #7F8C96; stroke-width: 5; stroke-linecap: round; }
      .particle { stroke: #C62828; stroke-width: 2.5; stroke-dasharray: 9 5; fill: none; }
      .stop { stroke: #C62828; stroke-width: 3.5; fill: none; }
      .los { stroke: #333; stroke-width: 2.5; stroke-dasharray: 3 5; fill: none; }
      .leader { stroke: #888; stroke-width: 1.2; fill: none; }
    </style>
    <marker id="arrowSun" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0,2 L 14,7 L 0,12 Z" fill="#D9A400"/>
    </marker>
    <marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0,2 L 14,7 L 0,12 Z" fill="#C62828"/>
    </marker>
    <pattern id="iceHatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#D6E8F5"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#B5D0E6" stroke-width="3"/>
    </pattern>
    <clipPath id="clipPage"><rect width="1000" height="780"/></clipPath>
  </defs>
  <rect id="background" width="1000" height="780" fill="#ffffff"/>

  <g inkscape:groupmode="layer" id="layer-jupiter" inkscape:label="Jupiter" clip-path="url(#clipPage)">
    <circle cx="1000" cy="0" r="120" fill="#E3C9A0"/>
    <circle cx="1000" cy="0" r="112" fill="none" stroke="#C99C6B" stroke-width="9"/>
    <circle cx="1000" cy="0" r="92" fill="none" stroke="#E9D5B4" stroke-width="9"/>
    <circle cx="1000" cy="0" r="74" fill="none" stroke="#B98457" stroke-width="9"/>
    <circle cx="1000" cy="0" r="52" fill="none" stroke="#EAD7B8" stroke-width="9"/>
    <text x="860" y="30" text-anchor="end">Jupiter (not to scale)</text>
  </g>
  <g inkscape:groupmode="layer" id="layer-sunlight" inkscape:label="Sunlight">
    <text x="20" y="40">Sunlight, about 50 W/m² at 5.2 AU</text>
    <path class="ray" d="M 40,70 L 40,604.0" marker-end="url(#arrowSun)"/>
    <path class="ray" d="M 40,606.0 L 305,522"/>
    <path class="ray" d="M 75,70 L 75,627.9" marker-end="url(#arrowSun)"/>
    <path class="ray" d="M 75,629.9 L 305,522"/>
    <path class="ray" d="M 110,70 L 110,648.5" marker-end="url(#arrowSun)"/>
    <path class="ray" d="M 110,650.5 L 305,522"/>
    <path class="ray" d="M 895,70 L 895,672.8" marker-end="url(#arrowSun)"/>
    <path class="ray" d="M 895,674.8 L 635,610"/>
    <path class="ray" d="M 925,70 L 925,648.0" marker-end="url(#arrowSun)"/>
    <path class="ray" d="M 925,650.0 L 635,610"/>
    <path class="ray" d="M 955,70 L 955,620.6" marker-end="url(#arrowSun)"/>
    <path class="ray" d="M 955,622.6 L 635,610"/>
  </g>
  <g inkscape:groupmode="layer" id="layer-mirrors" inkscape:label="Concentrating mirrors">
    <path id="warming-mirror" class="mirror" d="M 20.0,590.8 L 24.8,594.6 L 29.6,598.2 L 34.4,601.8 L 39.2,605.4 L 44.0,608.9 L 48.8,612.3 L 53.5,615.7 L 58.3,619.0 L 63.1,622.2 L 67.9,625.4 L 72.7,628.5 L 77.5,631.5 L 82.3,634.5 L 87.1,637.4 L 91.9,640.3 L 96.7,643.1 L 101.5,645.8 L 106.2,648.4 L 111.0,651.0 L 115.8,653.6 L 120.6,656.0 L 125.4,658.5 L 130.2,660.8 L 135.0,663.1"/>
    <path id="cavity-mirror" class="mirror" d="M 880.0,686.2 L 884.0,683.3 L 887.9,680.3 L 891.9,677.3 L 895.8,674.2 L 899.8,671.1 L 903.8,667.9 L 907.7,664.7 L 911.7,661.4 L 915.6,658.1 L 919.6,654.7 L 923.5,651.3 L 927.5,647.9 L 931.5,644.4 L 935.4,640.8 L 939.4,637.2 L 943.3,633.6 L 947.3,629.9 L 951.2,626.1 L 955.2,622.4 L 959.2,618.5 L 963.1,614.6 L 967.1,610.7 L 971.0,606.7 L 975.0,602.7"/>
    <line id="secondary-mirror" class="fold" x1="620" y1="595" x2="650" y2="625"/>
  </g>
  <g inkscape:groupmode="layer" id="layer-payload" inkscape:label="Payload and shield">
    <path id="engine-bell" d="M 200,370 L 200,440 L 150,468 L 150,342 Z" fill="#9A9A9A" stroke="#444" stroke-width="2.5"/>
    <path id="nose-cone" d="M 755,290 Q 845,300 872,405 Q 845,510 755,520 Z" fill="#BDBDBD" stroke="#444" stroke-width="2.5"/>
    <rect id="shield-body" x="200" y="290" width="560" height="230" rx="18" fill="url(#iceHatch)" stroke="#444" stroke-width="3"/>
    <rect id="electronics" x="360" y="330" width="110" height="70" rx="4" fill="#EFEFEF" stroke="#444" stroke-width="2"/>
    <text x="415" y="371" text-anchor="middle" class="small">electronics</text>
    <path id="wire" d="M 516,345 L 490,345 L 490,365 L 470,365" stroke="#444" stroke-width="2" fill="none"/>
    <rect id="absorber" x="250" y="514" width="110" height="10" fill="#7A2E0E"/>
    <text x="215" y="480">Frozen-volatile shield</text>
  </g>
  <g inkscape:groupmode="layer" id="layer-cavity" inkscape:label="Mirrored light cavity">
    <path id="cavity-channel" d="M 620,520 L 620,450 L 550,450 L 520,420 L 520,350 L 550,350 L 550,420 L 620,420 L 650,450 L 650,520 Z" fill="#FFF7DC" stroke="#444" stroke-width="2"/>
    <path id="cavity-beam" class="beam" d="M 635,610 L 635,435 L 535,435 L 535,356"/>
    <line id="fold-mirror-1" class="fold" x1="620" y1="420" x2="650" y2="450"/>
    <line id="fold-mirror-2" class="fold" x1="520" y1="420" x2="550" y2="450"/>
    <rect id="pv-cells" x="516" y="340" width="38" height="11" fill="#1F3B73"/>
    <line x1="525" y1="340" x2="525" y2="351" stroke="#8FA8D8" stroke-width="1"/>
    <line x1="535" y1="340" x2="535" y2="351" stroke="#8FA8D8" stroke-width="1"/>
    <line x1="545" y1="340" x2="545" y2="351" stroke="#8FA8D8" stroke-width="1"/>
    <text x="664" y="440" class="small">M1</text>
    <text x="510" y="445" text-anchor="end" class="small">M2</text>
    <text x="562" y="350" class="small">PV cells</text>
    <path id="blocked-line-of-sight" class="los" d="M 635,520 L 535,345"/>
  </g>
  <g inkscape:groupmode="layer" id="layer-particles" inkscape:label="Belt particles">
    <path class="particle" d="M 330,190 L 361,300" marker-end="url(#arrowRed)"/>
    <path class="particle" d="M 361,300 L 368,318"/>
    <path class="stop" d="M 361,311 L 375,325 M 361,325 L 375,311"/>
    <path class="particle" d="M 610,180 L 618,280" marker-end="url(#arrowRed)"/>
    <path class="particle" d="M 618,280 L 622,312"/>
    <path class="stop" d="M 615,305 L 629,319 M 615,319 L 629,305"/>
    <path class="particle" d="M 770,705 L 646,515" marker-end="url(#arrowRed)"/>
    <path class="particle" d="M 646,515 L 606,456"/>
    <path class="stop" d="M 599,449 L 613,463 M 599,463 L 613,449"/>
    <path class="particle" d="M 645,760 L 645,575" marker-end="url(#arrowRed)"/>
    <path class="particle" d="M 645,575 L 645,398"/>
    <path class="stop" d="M 638,391 L 652,405 M 638,405 L 652,391"/>
    <text x="480" y="140" text-anchor="middle">Belt electrons and protons fly nearly straight</text>
    <text x="480" y="162" text-anchor="middle">(gyroradius about 85 m) and stop in the shield</text>
  </g>
  <g inkscape:groupmode="layer" id="layer-labels" inkscape:label="Labels">
    <text x="20" y="705">Concentrating mirror</text>
    <text x="20" y="726">warms the payload</text>
    <text x="990" y="715" text-anchor="end">Concentrating mirror</text>
    <text x="990" y="736" text-anchor="end">feeds the light cavity</text>
    <text x="612" y="640" text-anchor="end">Secondary mirror</text>
    <text x="612" y="545" text-anchor="end">Aperture</text>
    <text x="320" y="558">Absorber, warmed</text>
    <text x="320" y="579">by focused sunlight</text>
  </g>
  <g inkscape:groupmode="layer" id="layer-legend" inkscape:label="Legend">
    <rect x="235" y="665" width="420" height="105" rx="6" fill="#ffffff" stroke="#999"/>
    <path class="ray" d="M 247,685 L 277,685"/>
    <text x="287" y="690" class="small">sunlight</text>
    <path class="beam" style="stroke-width:7" d="M 247,708 L 277,708"/>
    <text x="287" y="713" class="small">concentrated beam</text>
    <path class="particle" d="M 247,731 L 277,731"/>
    <text x="287" y="736" class="small">belt particle</text>
    <path class="los" d="M 247,754 L 277,754"/>
    <text x="287" y="759" class="small">blocked line of sight</text>
    <path class="stop" d="M 469,679 L 481,691 M 469,691 L 481,679"/>
    <text x="500" y="690" class="small">stopped in shield</text>
    <line class="fold" x1="460" y1="708" x2="490" y2="708"/>
    <text x="500" y="713" class="small">mirror</text>
    <rect x="460" y="725" width="30" height="12" fill="url(#iceHatch)" stroke="#444"/>
    <text x="500" y="736" class="small">shield</text>
    <rect x="460" y="748" width="30" height="10" fill="#1F3B73"/>
    <text x="500" y="759" class="small">PV cells</text>
  </g>
</svg>
