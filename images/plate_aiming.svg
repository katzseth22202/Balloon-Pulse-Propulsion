<?xml version="1.0" encoding="UTF-8"?>
<!-- Plate aiming: steering a pusher plate by tilt and impact offset. Gas arrives from the
     left and the vehicle sits at the right, as in plate_stack.svg. The plate is tilted
     15 degrees (exaggerated) and the footprint sits a distance h off the vehicle axis,
     d behind the center of mass. The force triangle is drawn to the same 15 degrees, so
     the resultant's line of action passes exactly through the CM: h = d F_side / F_fwd.
     The inset shows the other control, firing a PuffSat early so it arrives as a wider,
     thinner disk. Struts and gas springs are omitted. Not to scale.
     Each element sits in a named Inkscape layer.
     Export for the paper with:
       inkscape images/plate_aiming.svg -o images/plate_aiming.pdf -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="1000" height="560" viewBox="0 0 1000 560">
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" inkscape:document-units="px"/>
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; fill: #222; }
      .small { font-size: 15px; }
      .leader { stroke: #888; stroke-width: 1.2; fill: none; }
      .struct { stroke: #7F8C96; stroke-width: 2; fill: none; }
      .ray { stroke: #D9A400; stroke-width: 2.5; fill: none; }
      .particle { stroke: #C62828; stroke-width: 2.5; stroke-dasharray: 9 5; fill: none; }
      .kevlar { stroke: #555; stroke-width: 1.3; fill: none; }
      .gas { stroke: #C77D1A; stroke-width: 3; fill: none; }
      .flow { stroke: #1F5F8B; stroke-width: 2.5; fill: none; }
      .force { stroke: #C62828; stroke-width: 3; fill: none; }
      .dim { stroke: #333; stroke-width: 1.3; fill: none; }
    </style>
    <marker id="arrowGas" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M 0,2 L 18,9 L 0,16 Z" fill="#C77D1A"/>
    </marker>
    <marker id="arrowFlow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 0,2 L 14,7 L 0,12 Z" fill="#1F5F8B"/>
    </marker>
    <marker id="arrowForce" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M 0,2 L 16,8 L 0,14 Z" fill="#C62828"/>
    </marker>
    <marker id="arrowDim" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse">
      <path d="M 0,1.5 L 12,6 L 0,10.5 Z" fill="#333"/>
    </marker>
  </defs>

  <g inkscape:groupmode="layer" id="layer_axis" inkscape:label="Vehicle axis">
    <line x1="240" y1="260" x2="990" y2="260" stroke="#888" stroke-width="1.5" stroke-dasharray="8 5"/>
    <text x="240" y="250" class="small">axis</text>
  </g>

  <g inkscape:groupmode="layer" id="layer_vehicle" inkscape:label="Vehicle and CM">
    <path d="M 554,215 L 920,215 C 950,215 975,240 985,260 C 975,280 950,305 920,305 L 554,305 Q 540,305 540,291 L 540,229 Q 540,215 554,215 Z"
          fill="#E4E9ED" stroke="#7F8C96" stroke-width="2"/>
    <text x="850" y="292" class="small">vehicle</text>
    <!-- Center-of-mass symbol: quartered circle. -->
    <circle cx="730" cy="260" r="12" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <path d="M 730,260 L 742,260 A 12 12 0 0 0 730,248 Z" fill="#222"/>
    <path d="M 730,260 L 718,260 A 12 12 0 0 0 730,272 Z" fill="#222"/>
    <text x="712" y="240">CM</text>
  </g>

  <g inkscape:groupmode="layer" id="layer_plate" inkscape:label="Tilted plate">
    <!-- Plate centerline crosses the axis at (301.3, 260); tilt 15 degrees. -->
    <rect x="295.3" y="60" width="12" height="400" fill="#7F8C96" transform="rotate(-15 301.3 260)"/>
    <line x1="301.3" y1="260" x2="301.3" y2="55" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 301.3,90 A 170 170 0 0 0 257.3,95.8" class="dim"/>
    <text x="248" y="96" text-anchor="end">tilt</text>
    <!-- Footprint on the face, centered h below the axis. -->
    <ellipse cx="324" cy="368.6" rx="7" ry="34" fill="#F6C177" stroke="#C77D1A" stroke-width="1.5" transform="rotate(-15 324 368.6)"/>
  </g>

  <g inkscape:groupmode="layer" id="layer_gas" inkscape:label="Arriving gas and exhaust">
    <ellipse cx="110" cy="367" rx="14" ry="34" fill="#F6C177" fill-opacity="0.75" stroke="#C77D1A" stroke-width="1.5"/>
    <line x1="130" y1="367" x2="250" y2="367" class="gas" marker-end="url(#arrowGas)"/>
    <text x="40" y="318">arriving PuffSat gas</text>
    <line x1="316" y1="378" x2="214" y2="437" class="flow" marker-end="url(#arrowFlow)"/>
    <line x1="318" y1="392" x2="232" y2="472" class="flow" marker-end="url(#arrowFlow)"/>
    <text x="110" y="505">deflected exhaust</text>
  </g>

  <g inkscape:groupmode="layer" id="layer_dims" inkscape:label="Dimensions h and d">
    <!-- h: from the axis to the footprint center, perpendicular to the axis. -->
    <line x1="268" y1="367" x2="318" y2="367" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="275" y1="262" x2="275" y2="365" class="dim" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/>
    <text x="281" y="322" font-style="italic">h</text>
    <!-- d: from the impact station to the CM, parallel to the axis. -->
    <line x1="330" y1="415" x2="330" y2="512" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="730" y1="274" x2="730" y2="512" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="332" y1="500" x2="728" y2="500" class="dim" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/>
    <text x="530" y="490" text-anchor="middle" font-style="italic">d</text>
  </g>

  <g inkscape:groupmode="layer" id="layer_forces" inkscape:label="Forces and line of action">
    <!-- F_side / F_fwd = tan 15 deg = 0.268, so the resultant runs along the plate normal. -->
    <line x1="330" y1="367" x2="470" y2="367" class="force" marker-end="url(#arrowForce)"/>
    <line x1="470" y1="367" x2="470" y2="329.5" class="force" marker-end="url(#arrowForce)"/>
    <line x1="330" y1="367" x2="470" y2="329.5" class="force" stroke-width="3.5" marker-end="url(#arrowForce)"/>
    <line x1="470" y1="329.5" x2="780" y2="246.4" stroke="#C62828" stroke-width="1.8" stroke-dasharray="9 5"/>
    <text x="385" y="392">F<tspan baseline-shift="sub" font-size="13">fwd</tspan></text>
    <text x="480" y="356">F<tspan baseline-shift="sub" font-size="13">side</tspan></text>
    <text x="352" y="350" class="small" transform="rotate(-15 352 350)">resultant</text>
    <path d="M 506,196 L 511,316" class="leader"/>
    <text x="440" y="190">line of action passes through the CM</text>
  </g>

  <g inkscape:groupmode="layer" id="layer_inset" inkscape:label="Inset: fire early">
    <rect x="640" y="20" width="345" height="150" rx="6" fill="none" stroke="#AAA" stroke-width="1.3"/>
    <ellipse cx="690" cy="88" rx="10" ry="30" fill="#F6C177" stroke="#C77D1A" stroke-width="1.5"/>
    <text x="690" y="148" text-anchor="middle" class="small">on time</text>
    <ellipse cx="790" cy="95" rx="5" ry="55" fill="#F6C177" fill-opacity="0.4" stroke="#C77D1A" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="815" y="80" class="small">fire early:</text>
    <text x="815" y="100" class="small">wider, thinner disk,</text>
    <text x="815" y="120" class="small">weaker pulse</text>
  </g>
</svg>
