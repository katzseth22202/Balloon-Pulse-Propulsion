    <line x1="102.0" y1="90.0" x2="110.0" y2="90.0" class="leader" stroke="#333" stroke-width="2"/>
    <text x="98.0" y="95.0" class="small" text-anchor="end">100%</text>
    <text x="20.0" y="58.0">heating received so far</text>
  </g>

