    <text x="900.0" y="366.0" class="small" text-anchor="middle">0</text>
    <text x="900.0" y="68.0" class="small" text-anchor="middle">impact</text>
    <line x1="900.0" y1="74.0" x2="900.0" y2="340.0" class="leader" stroke-dasharray="4 4"/>
    <text x="930.0" y="345.0" class="small"></text>
