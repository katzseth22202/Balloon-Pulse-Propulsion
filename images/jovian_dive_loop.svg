<?xml version="1.0" encoding="UTF-8"?>
<!-- The Jovian dive cycle at a 4 solar radii perihelion, seen from above the Sun.
     The payload and the impactor stream both leave Earth and both are bent by an unpowered
     Jupiter flyby, the payload into a prograde dive and the impactors into a retrograde one
     on the mirror-image ellipse. They meet head-on at perihelion, and the boosted payload
     climbs back out across 1 AU to meet Earth three synodic periods after it left.
     Not to scale. Distances from the Sun are compressed (logarithmic inside 1 AU) so the node shows.
     Generated by todos/make_jovian_dive_svg.py (gitignored scratch in the paper repo).
     If that script exists, edit it and rerun it. If not, edit this file by hand.
     Export for the paper with:
       inkscape images/jovian_dive_loop.svg -o images/jovian_dive_loop.pdf -->
