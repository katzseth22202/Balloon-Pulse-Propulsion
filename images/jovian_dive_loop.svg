  <g inkscape:groupmode="layer" id="layer-bodies" inkscape:label="Earth, Jupiter, node">
    <circle cx="701.7" cy="418.1" r="7" fill="#ffffff" stroke="#C62828" stroke-width="2.4"/>
    <circle cx="696.1" cy="395.2" r="9" fill="#3A7DC9"/>
    <circle cx="436.2" cy="260.2" r="9" fill="#3A7DC9" stroke="#1F5F8B" stroke-width="3"/>
    <circle cx="138.4" cy="308.9" r="13" fill="#C8A27A"/>
    <circle cx="546.4" cy="473.7" r="7" fill="#ffffff" stroke="#222" stroke-width="2.2"/>
  </g>
  <g inkscape:groupmode="layer" id="layer-labels" inkscape:label="Labels">
    <text x="724.0" y="480.0" text-anchor="start" class="small"><tspan x="724.0" dy="0em">Earth at departure. Two pushes</tspan><tspan x="724.0" dy="1.2em">five days apart send the</tspan><tspan x="724.0" dy="1.2em">payload out at 10.54 km/s</tspan><tspan x="724.0" dy="1.2em">excess.</tspan></text>
    <path d="M 722.0,466.0 L 700.1,405.2" class="leader"/>
    <text x="760.0" y="300.0" text-anchor="start" class="small" style="fill:#C62828"><tspan x="760.0" dy="0em">Open circle: where Earth</tspan><tspan x="760.0" dy="1.2em">was 6.7 days earlier, when</tspan><tspan x="760.0" dy="1.2em">the impactors left at</tspan><tspan x="760.0" dy="1.2em">11.06 km/s.</tspan></text>
    <path d="M 758.0,350.0 L 709.7,414.1" class="leader"/>
    <text x="20.0" y="140.0" text-anchor="start" class="small"><tspan x="20.0" dy="0em">Unpowered Jupiter flyby, perijove at least</tspan><tspan x="20.0" dy="1.2em">4000 km altitude. It bends the payload into</tspan><tspan x="20.0" dy="1.2em">a prograde dive and the faster impactors</tspan><tspan x="20.0" dy="1.2em">into a retrograde one on the mirror ellipse.</tspan></text>
    <path d="M 120.0,212.0 L 134.4,296.9" class="leader"/>
    <text x="576.4" y="599.7" text-anchor="start" class="small"><tspan x="576.4" dy="0em">4 solar radii node. The streams meet</tspan><tspan x="576.4" dy="1.2em">head-on, closing at 617 km/s.</tspan><tspan x="576.4" dy="1.2em">The payload gains 35.04 km/s.</tspan></text>
    <path d="M 574.4,585.7 L 551.4,480.7" class="leader"/>
    <text x="520.0" y="40.0" text-anchor="start" class="small"><tspan x="520.0" dy="0em">Earth 3.2761 yr later, after three synodic</tspan><tspan x="520.0" dy="1.2em">periods. The payload crosses at 157.82 km/s</tspan><tspan x="520.0" dy="1.2em">and pushes the next cycle's payload.</tspan></text>
    <path d="M 560.0,90.0 L 442.2,252.2" class="leader"/>
  </g>
  <g inkscape:groupmode="layer" id="layer-legend" inkscape:label="Legend">
    <line x1="30" y1="905" x2="80" y2="905" stroke="#1F5F8B" stroke-width="3"/>
    <text x="92.0" y="911.0" text-anchor="start" class=""><tspan x="92.0" dy="0em">Payload, prograde. Dashed: climb-out after the node boost.</tspan></text>
    <line x1="30" y1="941" x2="80" y2="941" stroke="#C62828" stroke-width="3"/>
    <text x="92.0" y="947.0" text-anchor="start" class=""><tspan x="92.0" dy="0em">Impactor stream, retrograde. One-way, consumed at the node.</tspan></text>
  </g>
</svg>
