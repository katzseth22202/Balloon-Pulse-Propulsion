<?xml version="1.0" encoding="UTF-8"?>
<!-- The port gate and the plug wires of the 2.5 kg rod's 20 m^3 chamber.
     (a)-(c) The gate cycle in section through the insert, about 800 px per meter:
     two leaves slide in a slot through the insert, driven shut by pistons fed from a
     tap to the chamber, and opened again by springs.
     (d) The plug stands one chamber radius inside the port on polyethylene wires, which
     run to poles on the insert and to winches outside the shell. Chamber at 120 px per
     meter; the insert's offset, the backing hole and the wire angles are exaggerated.
     Each element sits in a named Inkscape layer.
     Export for the paper with:
       inkscape images/port_gate.svg -o images/port_gate.pdf -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="1000" height="1110" viewBox="0 0 1000 1110">
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" inkscape:document-units="px"/>
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 17px; fill: #222; }
      .small { font-size: 15px; }
      .tiny { font-size: 13.5px; }
      .title { font-size: 18px; font-weight: bold; }
      .leader { stroke: #888; stroke-width: 1.2; fill: none; }
      .wire { stroke: #2E7D32; stroke-width: 1.6; fill: none; }
      .wall { stroke: #5E6A73; stroke-width: 5; fill: none; }
      .spring { stroke: #333; stroke-width: 1.4; fill: none; }
      .gasin { stroke: #1F5F8B; stroke-width: 2; fill: none; }
    </style>
    <pattern id="foam" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#C9D3DA"/>
      <circle cx="1.5" cy="1.6" r="1.0" fill="#ffffff"/>
      <circle cx="3.9" cy="3.8" r="0.8" fill="#ffffff"/>
    </pattern>
    <linearGradient id="plasma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F29E4C"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <marker id="arrowDark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0,1 L 12,6 L 0,11 Z" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0,1 L 10,5 L 0,9 Z" fill="#1F5F8B"/>
    </marker>
    <marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0,1 L 10,5 L 0,9 Z" fill="#C62828"/>
    </marker>
    <marker id="dimEnd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0,1 L 10,5 L 0,9 Z" fill="#555"/>
    </marker>
    <marker id="dimStart" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M 10,1 L 0,5 L 10,9 Z" fill="#555"/>
    </marker>

    <!-- Upper half of the gate in its OPEN state (panel-local coordinates; port axis y=215).
         Insert slab x 125-175. Cylinder x 135-165, y 50-114. Leaf x 145-155. -->
    <g id="halfOpen">
      <rect x="135" y="50" width="30" height="64" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
      <rect x="165" y="52" width="10" height="5" fill="#9CC3DE"/>
      <rect x="136" y="60" width="28" height="6" fill="#2F3B45"/>
      <path class="spring" d="M 150,66 l -9,4 l 18,5 l -18,5 l 18,5 l -18,5 l 18,5 l -18,5 l 18,5 l -18,5 l 9,4"/>
      <line x1="150" y1="66" x2="150" y2="110" stroke="#2F3B45" stroke-width="3"/>
      <rect x="145" y="110" width="10" height="60" fill="#4A5560" stroke="#222" stroke-width="1"/>
    </g>
    <!-- Upper half CLOSED: piston and leaf 46 px nearer the axis, spring compressed. -->
    <g id="halfClosed">
      <rect x="135" y="50" width="30" height="64" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
      <rect x="165" y="52" width="10" height="5" fill="#9CC3DE"/>
      <rect x="137" y="110" width="26" height="4" fill="#8B3A3A"/>
      <rect x="136" y="104" width="28" height="6" fill="#2F3B45"/>
      <path class="spring" d="M 150,110 l -9,0.5 l 18,0.5 l -18,0.5 l 18,0.5 l -18,0.5 l 18,0.5 l -18,0.5 l 9,0.5"/>
      <line x1="150" y1="110" x2="150" y2="156" stroke="#2F3B45" stroke-width="3"/>
      <rect x="145" y="156" width="10" height="58" fill="#4A5560" stroke="#222" stroke-width="1"/>
    </g>
    <!-- Insert slab with its slot and port, shared by all three panels. -->
    <g id="slab">
      <rect x="125" y="36" width="50" height="358" fill="#C9A227" stroke="#8A6D12" stroke-width="1"/>
      <rect x="144" y="100" width="12" height="230" fill="#A8861C"/>
      <rect x="125" y="172" width="50" height="86" fill="#F4F8FB"/>
      <line x1="125" y1="172" x2="175" y2="172" stroke="#8A6D12" stroke-width="1"/>
      <line x1="125" y1="258" x2="175" y2="258" stroke="#8A6D12" stroke-width="1"/>
    </g>
  </defs>
  <rect id="background" width="1000" height="1110" fill="#ffffff"/>

  <!-- ============================ (a) Arrival ============================ -->
  <g inkscape:groupmode="layer" id="layer-a" inkscape:label="(a) Arrival, gate open">
    <text x="12" y="28" class="title">(a) Arrival: gate open</text>
    <g transform="translate(0,10)">
      <rect x="175" y="36" width="150" height="358" fill="#E3F0FA"/>
      <use xlink:href="#slab"/>
      <use xlink:href="#halfOpen"/>
      <use xlink:href="#halfOpen" transform="translate(0,430) scale(1,-1)"/>
      <!-- rod mid-port -->
      <rect x="20" y="187.5" width="235" height="55" rx="3" fill="#B8C2CA" stroke="#4A90B8" stroke-width="1.4"/>
      <line x1="30" y1="160" x2="95" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>
      <text x="40" y="221" class="small">rod</text>
      <!-- labels -->
      <text x="200" y="84" class="tiny">gas tap</text>
      <line x1="206" y1="72" x2="174" y2="56" class="leader"/>
      <text x="10" y="74" class="tiny">piston</text>
      <line x1="56" y1="70" x2="136" y2="73" class="leader"/>
      <text x="10" y="110" class="tiny">spring</text>
      <line x1="58" y1="106" x2="141" y2="100" class="leader"/>
      <text x="10" y="138" class="tiny">leaf in its slot</text>
      <line x1="112" y1="134" x2="145" y2="140" class="leader"/>
      <text x="10" y="300" class="tiny">insert</text>
      <line x1="56" y1="296" x2="128" y2="340" class="leader"/>
      <text x="215" y="140" class="tiny">chamber</text>
      <text x="10" y="432" class="tiny">springs hold both leaves back;</text>
      <text x="10" y="450" class="tiny">the rod crosses the 10.9 cm port in 9 µs</text>
    </g>
  </g>

  <!-- ============================ (b) Pulse ============================ -->
  <g inkscape:groupmode="layer" id="layer-b" inkscape:label="(b) Pulse, gate slams shut">
    <text x="345" y="28" class="title">(b) Pulse: gate slams shut</text>
    <g transform="translate(333,10)">
      <rect x="175" y="36" width="150" height="358" fill="url(#plasma)"/>
      <use xlink:href="#slab"/>
      <use xlink:href="#halfClosed"/>
      <use xlink:href="#halfClosed" transform="translate(0,430) scale(1,-1)"/>
      <!-- gas into the taps -->
      <line x1="215" y1="54" x2="178" y2="54" class="gasin" marker-end="url(#arrowBlue)"/>
      <line x1="215" y1="376" x2="178" y2="376" class="gasin" marker-end="url(#arrowBlue)"/>
      <!-- leaf motion -->
      <line x1="112" y1="120" x2="112" y2="160" stroke="#C62828" stroke-width="1.8" marker-end="url(#arrowRed)"/>
      <line x1="112" y1="310" x2="112" y2="270" stroke="#C62828" stroke-width="1.8" marker-end="url(#arrowRed)"/>
      <text x="200" y="210" class="tiny">500–820 bar</text>
      <text x="200" y="228" class="tiny">pulse</text>
      <text x="8" y="100" class="tiny">cushion</text>
      <line x1="62" y1="104" x2="137" y2="112" class="leader"/>
      <text x="8" y="215" class="tiny">gap ≤ 1 mm</text>
      <line x1="90" y1="211" x2="145" y2="215" class="leader"/>
      <text x="0" y="432" class="tiny">chamber gas drives the pistons (100 kN);</text>
      <text x="0" y="450" class="tiny">the leaves meet in 2–3 ms at 70–85 m/s</text>
    </g>
  </g>

  <!-- ============================ (c) Blowdown ============================ -->
  <g inkscape:groupmode="layer" id="layer-c" inkscape:label="(c) Blowdown, springs reopen">
    <text x="678" y="28" class="title">(c) Blowdown: springs reopen</text>
    <g transform="translate(666,10)">
      <rect x="175" y="36" width="150" height="358" fill="#F6EBDD"/>
      <use xlink:href="#slab"/>
      <use xlink:href="#halfOpen"/>
      <use xlink:href="#halfOpen" transform="translate(0,430) scale(1,-1)"/>
      <line x1="112" y1="160" x2="112" y2="120" stroke="#1F5F8B" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
      <line x1="112" y1="270" x2="112" y2="310" stroke="#1F5F8B" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
      <text x="196" y="210" class="tiny">below</text>
      <text x="196" y="228" class="tiny">~25 bar</text>
      <text x="4" y="432" class="tiny">a 5 kN spring preload wins once the</text>
      <text x="4" y="450" class="tiny">chamber falls below ~25 bar, 115–150 ms</text>
    </g>
  </g>

  <line x1="20" y1="478" x2="980" y2="478" stroke="#DDD" stroke-width="1"/>

  <!-- ============================ (d) Plug on wires ============================ -->
  <g inkscape:groupmode="layer" id="layer-d-title" inkscape:label="(d) Title">
    <text x="12" y="508" class="title">(d) The plug hangs on wires and follows the port</text>
  </g>

  <g inkscape:groupmode="layer" id="layer-d-parts" inkscape:label="(d) Chamber, insert, plug and wires">
    <!-- chamber: center (500,790), r = 202 px = 1.68 m at 120 px/m -->
    <circle cx="500" cy="790" r="200" fill="#E3F0FA"/>
    <path d="M 700,762 A 202 202 0 0 0 330,682" class="wall"/>
    <path d="M 330,898 A 202 202 0 0 0 700,818" class="wall"/>
    <path d="M 700,762 L 960,692" class="wall"/>
    <path d="M 700,818 L 960,888" class="wall"/>
    <!-- chamber axis and the rod's line -->
    <line x1="40" y1="790" x2="960" y2="790" stroke="#999" stroke-width="1" stroke-dasharray="6 5"/>
    <line x1="40" y1="766" x2="500" y2="766" stroke="#C62828" stroke-width="1" stroke-dasharray="3 4"/>
    <!-- fixed backing with a wide hole, closing the shell opening -->
    <rect x="286" y="660" width="16" height="80" fill="#7F8C96"/>
    <rect x="286" y="840" width="16" height="80" fill="#7F8C96"/>
    <line x1="302" y1="660" x2="330" y2="682" class="wall" stroke-width="4"/>
    <line x1="302" y1="920" x2="330" y2="898" class="wall" stroke-width="4"/>
    <!-- insert, moved up 24 px so its port sits on the rod's line -->
    <rect x="302" y="690" width="14" height="69.5" fill="#C9A227" stroke="#8A6D12" stroke-width="1"/>
    <rect x="302" y="772.5" width="14" height="69.5" fill="#C9A227" stroke="#8A6D12" stroke-width="1"/>
    <rect x="302" y="714" width="14" height="152" fill="none" stroke="#8A6D12" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- poles on the insert's outer face, reaching out through the backing hole -->
    <rect x="262" y="745" width="40" height="5" fill="#2F3B45"/>
    <rect x="262" y="782" width="40" height="5" fill="#2F3B45"/>
    <!-- plug: 0.98 m by 10.9 cm, front face at the chamber's center -->
    <rect x="500" y="759.5" width="118" height="13" fill="url(#foam)" stroke="#5E6F7C" stroke-width="1.4"/>
    <!-- port-side wires: pole tip, through the insert, to the plug's front -->
    <path class="wire" d="M 264,747.5 L 500,764"/>
    <path class="wire" d="M 264,784.5 L 500,768"/>
    <!-- throat-side wires: plug's rear, through small fixed holes, to winches -->
    <path class="wire" d="M 618,764 L 678.4,695.2 L 703,676"/>
    <path class="wire" d="M 618,768 L 678.4,884.8 L 703,904"/>
    <circle cx="678.4" cy="695.2" r="3" fill="#ffffff" stroke="#333" stroke-width="1"/>
    <circle cx="678.4" cy="884.8" r="3" fill="#ffffff" stroke="#333" stroke-width="1"/>
    <circle cx="712" cy="668" r="10" fill="#2F3B45"/>
    <circle cx="712" cy="912" r="10" fill="#2F3B45"/>
    <line x1="712" y1="668" x2="719" y2="661" stroke="#ffffff" stroke-width="2"/>
    <line x1="712" y1="912" x2="719" y2="919" stroke="#ffffff" stroke-width="2"/>
    <!-- rod arriving on its line -->
    <rect x="120" y="762" width="83" height="8" rx="1.5" fill="#B8C2CA" stroke="#4A90B8" stroke-width="1.2"/>
    <line x1="50" y1="766" x2="112" y2="766" stroke="#333" stroke-width="2" marker-end="url(#arrowDark)"/>
    <!-- insert stroke and plug following it -->
    <line x1="330" y1="740" x2="330" y2="726" stroke="#C62828" stroke-width="1.6" marker-end="url(#arrowRed)"/>
    <line x1="560" y1="750" x2="560" y2="736" stroke="#C62828" stroke-width="1.6" marker-end="url(#arrowRed)"/>
    <!-- stand-off dimension -->
    <line x1="318" y1="620" x2="498" y2="620" stroke="#555" stroke-width="1.2" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
    <line x1="316" y1="614" x2="316" y2="684" stroke="#AAA" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="500" y1="614" x2="500" y2="756" stroke="#AAA" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <g inkscape:groupmode="layer" id="layer-d-labels" inkscape:label="(d) Labels">
    <text x="330" y="608" class="small">1.68 m stand-off, one chamber radius</text>
    <text x="40" y="560" class="small">poles ride on the insert, outside</text>
    <text x="40" y="578" class="small">the chamber, and carry the port-side</text>
    <text x="40" y="596" class="small">wires through small holes</text>
    <line x1="150" y1="602" x2="270" y2="744" class="leader"/>
    <text x="40" y="720" class="small">rod, 69 cm by 6.9 cm</text>
    <line x1="150" y1="726" x2="160" y2="760" class="leader"/>
    <text x="40" y="860" class="small">insert with the port and gate,</text>
    <text x="40" y="878" class="small">moved up; dashed where centered</text>
    <line x1="230" y1="864" x2="306" y2="830" class="leader"/>
    <text x="40" y="950" class="small">fixed backing; its hole</text>
    <text x="40" y="968" class="small">spans the insert's stroke</text>
    <line x1="210" y1="946" x2="290" y2="900" class="leader"/>
    <text x="420" y="838" class="small">foam plug, 0.98 m by 10.9 cm,</text>
    <text x="420" y="856" class="small">front face at the chamber's center</text>
    <line x1="530" y1="824" x2="560" y2="774" class="leader"/>
    <text x="420" y="720" class="small">polyethylene wires</text>
    <text x="420" y="738" class="small">through the plug's axis</text>
    <line x1="490" y1="742" x2="440" y2="757" class="leader"/>
    <text x="730" y="600" class="small">winches outside the shell</text>
    <text x="730" y="618" class="small">pay wire through small</text>
    <text x="730" y="636" class="small">fixed holes near the throat</text>
    <line x1="760" y1="642" x2="718" y2="662" class="leader"/>
    <text x="770" y="930" class="small">throat 0.149–0.198 m²;</text>
    <text x="770" y="948" class="small">the nozzle runs on</text>
    <text x="770" y="966" class="small">to a 7.5–8.7 m exit</text>
    <line x1="790" y1="916" x2="712" y2="822" class="leader"/>
    <text x="400" y="1030" class="small">20 m³ chamber, 1.68 m radius, filled with the charge gas</text>
    <text x="40" y="1060" class="tiny">The insert's offset, the backing hole and the wire angles are exaggerated. The insert moves the port up to 10 cm;</text>
    <text x="40" y="1078" class="tiny">the poles move with it, the winches pay out to match, and about 13 kN of tension holds the plug within 5 mm at 3 g.</text>
  </g>
</svg>
